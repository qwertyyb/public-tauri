name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]

    runs-on: ${{ matrix.platform }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.90"
        components: rustfmt, clippy

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Sync node version and setup cache
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Import Apple Developer Certificate
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        security find-identity -v -p codesigning build.keychain
    - name: Verify Certificate
      run: |
        CERT_INFO=$(security find-identity -v -p codesigning build.keychain)
        CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
        echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
        echo "Certificate imported."

    - name: Write Private Key File
      env:
        APPLE_API_KEY_CONTENT_BASE64: ${{ secrets.APPLE_API_KEY_CONTENT_BASE64 }}
      run: |
        mkdir -p .appstoreconnect
        echo $APPLE_API_KEY_CONTENT_BASE64 | base64 --decode > .appstoreconnect/private-key.p8
        echo "Private key file written."

    # 仅构建、不签名（不传 APPLE_SIGNING_IDENTITY，Tauri 便不会签任何二进制）；
    # 所有签名统一放到后续步骤里 inside-out 处理
    - name: Build the app
      run: pnpm run app:build
      env:
        TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    # 统一 inside-out 签名：内层 Mach-O → sidecar → 主程序 → 外层 .app
    - name: Sign bundled native binaries
      env:
        SIGN_ID: ${{ env.CERT_ID }}
        ENTITLEMENTS: ${{ github.workspace }}/src-tauri/Entitlements.plist
      run: |
        set -euo pipefail
        APP=$(/usr/bin/find "${{ github.workspace }}/src-tauri/target/release/bundle/macos" -maxdepth 1 -name '*.app' | head -n1)
        if [ -z "$APP" ]; then echo "未找到 .app 产物"; exit 1; fi
        NAME=$(basename "$APP" .app)
        echo "Signing $APP inside-out"

        # 1) 内层动态库 / native addon：仅对真实 Mach-O 文件签名
        #    注意 src-node/build 下部分产物是「同名目录里再套一个 .node」，-type f 可跳过目录本身
        /usr/bin/find "$APP" -type f \( -name '*.node' -o -name '*.dylib' -o -name '*.so' \) -print0 \
          | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                codesign --force --options runtime --timestamp --sign "$SIGN_ID" "$f"
              else
                echo "skip non-Mach-O: $f"
              fi
            done

        # 2) sidecar 可执行（如 node-v24.11.1，主程序除外）：V8 JIT 需要 entitlements
        /usr/bin/find "$APP/Contents/MacOS" -type f ! -name "$NAME" -print0 \
          | while IFS= read -r -d '' f; do
              codesign --force --options runtime --timestamp \
                --entitlements "$ENTITLEMENTS" --sign "$SIGN_ID" "$f"
            done

        # 3) 主程序（带 entitlements）
        codesign --force --options runtime --timestamp \
          --entitlements "$ENTITLEMENTS" --sign "$SIGN_ID" "$APP/Contents/MacOS/$NAME"

        # 4) 外层 .app 最后封口
        codesign --force --options runtime --timestamp \
          --entitlements "$ENTITLEMENTS" --sign "$SIGN_ID" "$APP"

        codesign --verify --deep --strict --verbose=2 "$APP"

    # 公证并装订 .app；Tauri 生成的 dmg 内嵌的是未补签 app，故用已装订 app 重建 dmg 再公证
    - name: Notarize, repackage DMG and staple
      env:
        SIGN_ID: ${{ env.CERT_ID }}
        APPLE_API_KEY_PATH: ${{ github.workspace }}/.appstoreconnect/private-key.p8
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      run: |
        set -euo pipefail
        MACOS_DIR="${{ github.workspace }}/src-tauri/target/release/bundle/macos"
        DMG_DIR="${{ github.workspace }}/src-tauri/target/release/bundle/dmg"
        APP=$(/usr/bin/find "$MACOS_DIR" -maxdepth 1 -name '*.app' | head -n1)
        NAME=$(basename "$APP" .app)

        # ---- 公证并装订 .app ----
        APP_ZIP="${{ github.workspace }}/${NAME}.zip"
        /usr/bin/ditto -c -k --keepParent "$APP" "$APP_ZIP"
        xcrun notarytool submit "$APP_ZIP" \
          --key "$APPLE_API_KEY_PATH" \
          --key-id "$APPLE_API_KEY" \
          --issuer "$APPLE_API_ISSUER" \
          --wait
        xcrun stapler staple "$APP"
        rm -f "$APP_ZIP"

        # ---- 用已装订 app 重建 DMG ----
        OLD_DMG=$(/usr/bin/find "$DMG_DIR" -maxdepth 1 -name '*.dmg' | head -n1 || true)
        DMG_PATH="${OLD_DMG:-$DMG_DIR/${NAME}.dmg}"
        mkdir -p "$DMG_DIR"
        rm -f "$DMG_PATH"
        STAGING=$(mktemp -d)
        cp -R "$APP" "$STAGING/"
        ln -s /Applications "$STAGING/Applications"
        hdiutil create -volname "$NAME" -srcfolder "$STAGING" -ov -format UDZO "$DMG_PATH"
        rm -rf "$STAGING"

        # ---- 签名 + 公证 + 装订 DMG ----
        codesign --force --timestamp --sign "$SIGN_ID" "$DMG_PATH"
        xcrun notarytool submit "$DMG_PATH" \
          --key "$APPLE_API_KEY_PATH" \
          --key-id "$APPLE_API_KEY" \
          --issuer "$APPLE_API_ISSUER" \
          --wait
        xcrun stapler staple "$DMG_PATH"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-artifacts
        path: |
          src-tauri/target/release/bundle/
          src-tauri/target/debug/bundle/